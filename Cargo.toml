[package]
name = "wreq-python"
version = "0.12.2"
description = "An ergonomic, privacy-aware Python HTTP Client"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/0x676e67/wreq-python"
authors = ["0x676e67 <gngppz@gmail.com>"]
edition = "2024"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "wreq"
crate-type = ["cdylib"]
doctest = false

[features]
default = ["abi3-py311"]

# Memory allocator options
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

# we build cp311-abi3 and cp310 wheels now, move this to pyo3 after we drop cp310
abi3-py311 = ["pyo3/abi3-py311"]
abi3-py313 = ["pyo3/abi3-py313"]
abi3-py314 = ["pyo3/abi3-py314"]

[dependencies]
tokio = "1.52.2"
tokio-util = "0.7.18"
pyo3 = { version = "0.29.0", features = [
    "indexmap",
    "multiple-pymethods",
    "extension-module",
    "generate-import-lib",
    "experimental-async",
] }
pyo3-async-runtimes = { version = "0.29.0", features = [
    "tokio-runtime",
    "unstable-streams",
] }
pin-project-lite = "0.2.16"
futures-util = { version = "0.3.33", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7.1"
indexmap = { version = "2.13.0", features = ["serde"] }
bytes = "1.12.1"
arc-swap = "1.9.2"
http = "1.4.2"
http-body-util = "0.1.4"
wreq = { version = "0.16.1", default-features = false, features = [
    "webpki-roots",
    "tokio-rt",
    "query",
    "form",
    "json",
    "socks",
    "stream",
    "multipart",
    "cookies",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "ws",
    "parking_lot",
] }
wreq-util = { version = "0.2.0", features = ["emulation-compression"] }
hickory-resolver = "0.25.2"
cookie = "0.18.2"
mimalloc = { version = "0.1.43", default-features = false, features = [
    "local_dynamic_tls",
], optional = true }
tikv-jemallocator = { version = "0.7.0", default-features = false, features = [
    "disable_initial_exec_tls",
], optional = true }

# Keep the Chrome 150–153 profiles and their required TLS support in sync.
[patch.crates-io]
wreq-util = { git = "https://github.com/0x676e67/wreq-util", rev = "e3922a2b2d976487cb4cf4e7b0ac290b3ce77f66" }
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
